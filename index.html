<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نظام المحل التجريبي</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="assets/demo.css">
</head>
<body>

<div class="demo" dir="rtl"><div class="demo-in">
  <p><b>نسخة تجريبية:</b> نفس الواجهة ديال النظام، ولكن البيانات كتبقى غير فهاد المتصفح. النظام الحقيقي كيخدم بـPHP + MySQL (XAMPP)، والبحث بالصورة فيه بنموذج CLIP — هنا مبسّط.</p>
  <button class="btn btn-main" id="showGuide" type="button">الدليل والمقارنة</button>
  <button class="btn" id="showSrc" type="button">كود السيرفر (PHP)</button>
  <button class="btn" id="resetDemo" type="button">إعادة البيانات</button>
</div></div>

<div dir="rtl" lang="ar">
  <header class="top"><div class="top-in">
    <div class="brand">نظام المحل<small>المخزون والبحث</small></div>
    <label class="branch"><span>الفرع:</span><select class="input" id="branch" autocomplete="off" style="min-height:38px;padding:4px 8px"></select></label>
  </div></header>

  <main id="app"><div class="empty">جاري التحميل…</div></main>

  <nav class="nav"><div class="nav-in">
    <a href="#/" id="navSearch" data-tab="search"><svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>البحث</a>
    <a href="#/add" data-tab="add"><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>إضافة منتوج</a>
    <a href="#/data/fabrics" data-tab="data"><svg class="ico" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>المعطيات</a>
  </div></nav>
</div>

<script src="assets/demo-api.js"></script>
<script type="module" src="assets/app.js"></script>
<script src="assets/guide.js"></script>
<script>
(function () {
  var FILES = [['api.php', 'كل العمليات (API)'], ['db.php', 'الاتصال وإنشاء الجداول'], ['config.php', 'الإعدادات'], ['vision.js', 'البحث بالصورة (CLIP)'], ['README.md', 'طريقة التشغيل']];
  function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
  document.getElementById('showSrc').onclick = function () {
    var el = document.createElement('div'); el.className = 'modal';
    el.innerHTML = '<div class="sheet wide" role="dialog" aria-modal="true" dir="rtl"><div class="sheet-head"><h3>كود السيرفر — النظام الحقيقي</h3><button class="close" type="button" aria-label="إغلاق">×</button></div>' +
      '<div class="src-tabs">' + FILES.map(function (f, i) { return '<button type="button" data-i="' + i + '" title="' + esc(f[1]) + '">' + esc(f[0]) + '</button>'; }).join('') + '</div>' +
      '<p class="muted" id="srcHint" style="margin:0 0 8px"></p><pre class="src" id="srcBox">…</pre></div>';
    document.body.appendChild(el);
    var close = function () { el.remove(); };
    el.querySelector('.close').onclick = close;
    el.addEventListener('click', function (e) { if (e.target === el) close(); });
    var show = function (i) {
      el.querySelectorAll('.src-tabs button').forEach(function (b) { b.classList.toggle('on', +b.dataset.i === i); });
      el.querySelector('#srcHint').textContent = FILES[i][1];
      fetch('source/' + FILES[i][0] + '.txt').then(function (r) { return r.text(); })
        .then(function (t) { el.querySelector('#srcBox').textContent = t; })
        .catch(function () { el.querySelector('#srcBox').textContent = 'ما قدرتش نقرا الملف.'; });
    };
    el.querySelectorAll('.src-tabs button').forEach(function (b) { b.onclick = function () { show(+b.dataset.i); }; });
    show(0);
  };
  document.getElementById('resetDemo').onclick = function () {
    if (window.__demoReset) window.__demoReset();
    location.hash = '#/'; location.reload();
  };
})();
</script>
</body>
</html>
